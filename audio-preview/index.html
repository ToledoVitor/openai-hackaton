<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cozy City Audio</title>
    <style>
      :root { color: #2d3d35; background: #eef1dc; font: 18px/1.5 system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { width: min(34rem, calc(100% - 3rem)); padding: 2rem; border-radius: 1.5rem; background: #fffaf0; box-shadow: 0 1rem 3rem #53745c33; }
      h1 { margin-top: 0; }
      button { padding: .7rem 1rem; border: 0; border-radius: 999px; background: #4f745c; color: white; font: inherit; cursor: pointer; }
      label { display: grid; gap: .35rem; margin-top: 1rem; }
      input { width: 100%; }
      small { color: #597064; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cozy City Audio</h1>
      <p>Existing CC0 music loop with sparse urban ambience.</p>
      <button id="start" type="button">Start audio</button>
      <button id="mute" type="button">Mute</button>
      <label>Music <input id="music" type="range" min="0" max="1" value="0.35" step="0.01" /></label>
      <label>Ambience <input id="ambience" type="range" min="0" max="1" value="0.25" step="0.01" /></label>
      <p><small>Random sounds: birds, footsteps, bicycle bell, crossing beep, distant traffic.</small></p>
      <p><a href="/audio/SOURCES.md">CC0 sources and checksums</a></p>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
