name: Feature request
description: Propose focused player or contributor improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem
      description: Describe user need, not only proposed implementation.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed outcome
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Primary area
      options: [Learning journey, 3D exploration, Accessibility, Localization, Security, Developer experience, Asset provenance]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Offline test approach
      description: Explain deterministic coverage without provider or Realtime traffic.
    validations:
      required: true
