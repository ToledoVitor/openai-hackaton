name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Safety check
      options:
        - label: This report contains no API key, private prompt, personal data, or microphone recording.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include active language, mission, browser, and viewport.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide minimal deterministic steps.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    attributes:
      label: Commit or version
    validations:
      required: true
